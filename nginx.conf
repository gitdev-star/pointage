limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream machine_up {
    server 192.168.8.210:8006;
    keepalive 32;
}
upstream notification_up {
    server 192.168.8.210:8007;
    keepalive 16;
}
upstream auth_up {
    server 192.168.8.210:8005;
    keepalive 16;
}
upstream ocs_up {
    server 192.168.8.210:8010;
    keepalive 8;
}

# =====================================================
# PATH: pointage/nginx.conf
# Nginx reverse proxy — replaces Traefik
# Serves React static files directly from disk
# Proxies API calls to backend containers
# =====================================================

upstream django_auth {
    server django_auth:8000;
}

upstream django_hr {
    server django_hr:8002;
}

upstream react {
    server react:3000;
}

# ── Redirect HTTP → HTTPS (uncomment on AWS with SSL) ──
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name 192.168.8.210;   # ← replace with your domain on AWS

    # ── Security headers ──────────────────────────────
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin"   always;

    # ── Gzip compression ──────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    client_max_body_size 20M;

    # ── Django admin static files (served directly from collectstatic volume) ──
    location /static/admin/ {
        alias /vol/static/admin/;
        expires 30d;
        access_log off;
    }

    location /static/rest_framework/ {
        alias /vol/static/rest_framework/;
        expires 30d;
        access_log off;
    }

    # ── Django HR media files ─────────────────────────
    location /media/ {
        alias /vol/media/;
        expires 7d;
        access_log off;
    }

    # ── Devices/Clockers API ─────────────────────────────
    location /api/clockers/ {
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django Auth API ───────────────────────────────
    location /api/auth/ {
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }


    # ── Django HR API ─────────────────────────────────
    # Strip /api/hr prefix before forwarding
    # /api/hr/employees/ → /api/employees/
    location /api/hr/ {
        rewrite            ^/api/hr/(.*)$ /api/$1 break;
        proxy_pass         http://django_hr;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django Admin ──────────────────────────────────
    location /admin/ {
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── React HMR WebSocket (dev only — remove in production build) ──
    location /ws {
        proxy_pass             http://react;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
    }

    # ── FastAPI Attendance API ───────────────────────
    location /api/fastapi/ {
        proxy_pass         http://fastapi:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── React Frontend (catch-all) ────────────────────
    location / {
        proxy_pass         http://react;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # React Router — always serve index.html for unknown paths
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}

