limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream machine_up {
    server ${SERVER_IP}:8006;
    keepalive 32;
}
upstream notification_up {
    server ${SERVER_IP}:8007;
    keepalive 16;
}
upstream auth_up {
    server ${SERVER_IP}:8005;
    keepalive 16;
}
upstream ocs_up {
    server ${SERVER_IP}:8010;
    keepalive 8;
}

upstream django_auth {
    server django_auth:8000;
}

upstream django_hr {
    server django_hr:8002;
}

upstream react {
    server react:3000;
}

upstream glitchtip {
    server glitchtip-web:8000;
}

# ── Redirect HTTP → HTTPS ──────────────────────────────
server {
    listen 80;
    server_name ${SERVER_IP};
    return 301 https://$host$request_uri;
}

# ── HTTPS Main Server ──────────────────────────────────
server {
    listen 443 ssl;
    server_name ${SERVER_IP};

    # ── SSL Certificate ────────────────────────────────
    # Local: self-signed cert
    # Production: replace paths with:
    #   /etc/letsencrypt/live/yourdomain/fullchain.pem
    #   /etc/letsencrypt/live/yourdomain/privkey.pem
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header X-Frame-Options           "SAMEORIGIN"                         always;
    add_header X-XSS-Protection          "1; mode=block"                      always;
    add_header Referrer-Policy           "strict-origin"                      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip compression ──────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    client_max_body_size 20M;

    # ── Django admin static files ──────────────────────
    location /static/admin/ {
        alias /vol/static/admin/;
        expires 30d;
        access_log off;
    }

    location /static/rest_framework/ {
        alias /vol/static/rest_framework/;
        expires 30d;
        access_log off;
    }

    # ── Django HR media files ─────────────────────────
    location /media/ {
        alias /vol/media/;
        expires 7d;
        access_log off;
    }

    # ── Devices/Clockers API ──────────────────────────
    location /api/clockers/ {
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django Auth API ───────────────────────────────
    location /api/auth/ {
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django HR API ─────────────────────────────────
    location /api/hr/ {
        rewrite            ^/api/hr/(.*)$ /api/$1 break;
        proxy_pass         http://django_hr;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django Admin ──────────────────────────────────
    location /admin/ {
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }


    # ── Health check proxies for uptime monitoring ────
    location /health/auth/ {
        rewrite            ^/health/auth/$ /health/ break;
        proxy_pass         http://django_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health/hr/ {
        rewrite            ^/health/hr/$ /health/ break;
        proxy_pass         http://django_hr;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── React HMR WebSocket ───────────────────────────
    location /ws {
        proxy_pass             http://react;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
    }

    # ── FastAPI Attendance API ────────────────────────
    location /api/fastapi/ {
        proxy_pass         http://fastapi:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── GlitchTip ingest tunnel (avoids self-signed cert on :8443 for browser SDK) ──
    location /glitchtip-ingest/ {
        rewrite            ^/glitchtip-ingest/(.*)$ /$1 break;
        proxy_pass         http://glitchtip;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # ── React Frontend (catch-all) ────────────────────
    location / {
        proxy_pass         http://react;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}

# ── GlitchTip (dedicated HTTPS port) ───────────────────
server {
    listen 8443 ssl;
    server_name ${SERVER_IP};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://glitchtip;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}