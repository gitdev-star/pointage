# =====================================================
# PATH: pointage/traefik.yml
# Traefik v2 static configuration
# =====================================================

api:
  dashboard: true
  insecure: true   # Dashboard on :8081 — change to false when on domain + HTTPS

entryPoints:
  web:
    address: ":80"
  dashboard:
    address: ":8081"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # Only route containers with traefik.enable=true
    network: pointage_net

log:
  level: INFO

accessLog: {}
