[pytest]
# FastAPI tests only - no Django configuration
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow
    real_cross_service: hits real django-hr over docker network, excluded from default test job

# Coverage
addopts =
    -v
    --ignore=tests/integration
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=60