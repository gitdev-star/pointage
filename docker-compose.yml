# =====================================================
# PATH: pointage/docker-compose.yml
# Nginx reverse proxy — replaces Traefik
# Only port 80 (HTTP) and 8080 (FastAPI) are public
# Everything else is internal on pointage_net
# =====================================================

networks:
  pointage_net:
    driver: bridge

services:

  # ── Nginx Gateway ────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_auth_static:/vol/static:ro          # Django collectstatic output
      - django_hr_media:/vol/media:ro              # Django HR media uploads
    networks:
      - pointage_net
    depends_on:
      - django-auth
      - django-hr
      - react
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pointage_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_pointage
    expose:
      - "6379"
    networks:
      - pointage_net
    restart: unless-stopped

  # ── Django Auth (Port 8000) ──────────────────────────────────────────────────
  django-auth:
    build:
      context: .
      dockerfile: Dockerfiles/django.Dockerfile
    container_name: django_auth
    expose:
      - "8000"
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LDAP_SERVER_URI=ldap://192.168.8.1:389
      - SERVICE_INTERNAL_KEY=${SERVICE_INTERNAL_KEY}
    volumes:
      - ./django_auth:/app
      - django_auth_static:/app/staticfiles   # collectstatic writes here, Nginx reads it
    networks:
      - pointage_net
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --config /dev/null --workers 8 --threads 2 --worker-class gthread --timeout 120 --max-requests 1000 --max-requests-jitter 50"

  # ── Django HR (Port 8002) ────────────────────────────────────────────────────
  # Nginx strips /api/hr prefix before forwarding:
  #   /api/hr/accounts/me/  → /api/accounts/me/  ✓
  #   /api/hr/employees/    → /api/employees/     ✓
  django-hr:
    build:
      context: .
      dockerfile: Dockerfiles/django_hr.Dockerfile
    container_name: django_hr
    expose:
      - "8002"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${HR_DB_NAME}
      - ATTENDANCE_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SERVICE_INTERNAL_KEY=${SERVICE_INTERNAL_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./django_hr:/app
      - django_hr_media:/app/media
    networks:
      - pointage_net
    depends_on:
      django-auth:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "/app/entrypoint.sh"
    restart: unless-stopped

  # ── FastAPI (Port 8080) ──────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfiles/fastapi.Dockerfile
    container_name: fastapi
    network_mode: "host"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_AUTH_URL=http://127.0.0.1:8000/api/clockers/
      - DJANGO_HR_URL=http://127.0.0.1:8002
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HR_DB_HOST=${POSTGRES_HOST}
      - HR_DB_PORT=${POSTGRES_PORT}
      - HR_DB_NAME=${HR_DB_NAME}
      - HR_DB_USER=${POSTGRES_USER}
      - HR_DB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./:/app
    depends_on:
      django-auth:
        condition: service_started
    restart: unless-stopped

  # ── Attendance Sync ──────────────────────────────────────────────────────────
  sync:
    build:
      context: .
      dockerfile: Dockerfiles/fastapi.Dockerfile
    container_name: attendance_sync
    network_mode: "host"
    command: python sync_service.py
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_AUTH_URL=http://127.0.0.1:8000/api/clockers/
      - DJANGO_HR_URL=http://127.0.0.1:8002
    volumes:
      - ./:/app
    depends_on:
      django-auth:
        condition: service_started
    restart: unless-stopped

  # ── React Frontend ───────────────────────────────────────────────────────────
  react:
    build:
      context: ./frontend
      dockerfile: ../Dockerfiles/react.Dockerfile
    container_name: react
    expose:
      - "3000"
    environment:
      - REACT_APP_AUTH_URL=http://192.168.8.210/api/auth
      - REACT_APP_HR_URL=http://192.168.8.210/api/hr
      - REACT_APP_FASTAPI_URL=http://192.168.8.210:8080
      - REACT_APP_API_URL=http://192.168.8.210:8080
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=80
      - WDS_SOCKET_HOST=192.168.8.210
      - WDS_SOCKET_PATH=/ws
    volumes:
      - ./frontend:/app
    networks:
      - pointage_net
    depends_on:
      - fastapi
      - django-hr

  # ── Cron ─────────────────────────────────────────────────────────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfiles/django_hr.Dockerfile
    container_name: pointage_cron
    restart: unless-stopped
    env_file: .env
    networks:
      - pointage_net
    depends_on:
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${HR_DB_NAME}
      - ATTENDANCE_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SERVICE_INTERNAL_KEY=${SERVICE_INTERNAL_KEY}
    volumes:
      - ./django_hr:/app
    command: bash -c "echo '0 7 * * * cd /app && python3 manage.py send_cdd_alerts >> /var/log/cron.log 2>&1' > /etc/cron.d/hr-cron && echo '0 7 * * * cd /app && python3 manage.py send_maternity_alerts >> /var/log/cron.log 2>&1' >> /etc/cron.d/hr-cron && chmod 0644 /etc/cron.d/hr-cron && crontab /etc/cron.d/hr-cron && cron -f"

volumes:
  postgres_data:
  django_hr_media:
  django_auth_static:    # shared between django-auth (write) and nginx (read)
