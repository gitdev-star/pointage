# =====================================================
# PATH: pointage/docker-compose.yml
# Nginx reverse proxy — replaces Traefik
# Only port 80 (HTTP→HTTPS redirect) and 443 (HTTPS) are public
# Everything else is internal on pointage_net
# =====================================================

networks:
  pointage_net:
    driver: bridge

services:

  # ── Nginx Gateway ────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      - SERVER_IP=${SERVER_IP}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./ssl:/etc/nginx/ssl:ro                    # SSL certificates
      - django_auth_static:/vol/static:ro          # Django collectstatic output
      - django_hr_media:/vol/media:ro              # Django HR media uploads
    networks:
      - pointage_net
    depends_on:
      - django-auth
      - django-hr
      - react
    restart: unless-stopped


  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_pointage
    expose:
      - "6379"
    networks:
      - pointage_net
    restart: unless-stopped

  # ── Django Auth (Port 8000) ──────────────────────────────────────────────────
  django-auth:
    build:
      context: .
      dockerfile: Dockerfiles/django.Dockerfile
    container_name: django_auth
    expose:
      - "8000"
    env_file: .env
    environment:
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LDAP_SERVER_URI=${LDAP_SERVER_URI} 
      - SERVICE_INTERNAL_KEY=${SERVICE_INTERNAL_KEY}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN_DJANGO_AUTH}
    volumes:
      - ./django_auth:/app
      - django_auth_static:/app/staticfiles
      - ./ssl:/etc/ssl/glitchtip:ro
    networks:
      - pointage_net
    depends_on:
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --config /dev/null --workers 8 --threads 2 --worker-class gthread --timeout 120 --max-requests 1000 --max-requests-jitter 50"

  # ── Django HR (Port 8002) ────────────────────────────────────────────────────
  django-hr:
    build:
      context: .
      dockerfile: Dockerfiles/django_hr.Dockerfile
    container_name: django_hr
    expose:
      - "8002"
    env_file: .env
    environment:
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${HR_DB_NAME}
      - ATTENDANCE_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - ATTENDANCE_SERVICE_URL=http://fastapi:8080
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SERVICE_INTERNAL_KEY=${SERVICE_INTERNAL_KEY}
      - PYTHONUNBUFFERED=1
      - GLITCHTIP_DSN=${GLITCHTIP_DSN_DJANGO_HR}
    volumes:
      - ./django_hr:/app
      - django_hr_media:/app/media
      - ./ssl:/etc/ssl/glitchtip:ro
    networks:
      - pointage_net
    depends_on:
      django-auth:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "/app/entrypoint.sh"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── FastAPI (Port 8080) ──────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfiles/fastapi.Dockerfile
    container_name: fastapi
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_AUTH_URL=http://django-auth:8000/api/clockers/
      - DJANGO_HR_URL=http://django-hr:8002
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HR_DB_HOST=${POSTGRES_HOST}
      - HR_DB_PORT=${POSTGRES_PORT}
      - HR_DB_NAME=${HR_DB_NAME}
      - HR_DB_USER=${POSTGRES_USER}
      - HR_DB_PASSWORD=${POSTGRES_PASSWORD}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN_FASTAPI}
    volumes:
      - ./:/app
      - ./ssl:/etc/ssl/glitchtip:ro
    depends_on:
      django-auth:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pointage_net
    cap_add:
      - NET_RAW
    restart: unless-stopped

  # ── Attendance Sync ──────────────────────────────────────────────────────────
  sync:
    build:
      context: .
      dockerfile: Dockerfiles/fastapi.Dockerfile
    container_name: attendance_sync
    command: python sync_service.py
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_AUTH_URL=http://django-auth:8000/api/clockers/
      - DJANGO_HR_URL=http://django-hr:8002
      - GLITCHTIP_DSN=${GLITCHTIP_DSN_SYNC}
    volumes:
      - ./:/app
      - ./ssl:/etc/ssl/glitchtip:ro
    depends_on:
      django-auth:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pointage_net
    restart: unless-stopped

  # ── React Frontend ───────────────────────────────────────────────────────────
  react:
    build:
      context: ./frontend
      dockerfile: ../Dockerfiles/react.Dockerfile
    container_name: react
    expose:
      - "3000"
    environment:
      - REACT_APP_AUTH_URL=https://${SERVER_IP}/api/auth
      - REACT_APP_HR_URL=https://${SERVER_IP}/api/hr
      - REACT_APP_FASTAPI_URL=https://${SERVER_IP}/api/fastapi
      - REACT_APP_API_URL=https://${SERVER_IP}/api/fastapi
      - REACT_APP_CLOCKERS_URL=https://${SERVER_IP}/api/clockers
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=0
      - REACT_APP_GLITCHTIP_DSN=${GLITCHTIP_DSN_REACT}

      #- WDS_SOCKET_PROTOCOL=wss
      #- WDS_SOCKET_PORT=443
      #- WDS_SOCKET_HOST=${SERVER_IP}
      #- WDS_SOCKET_PATH=/ws
    volumes:
      - ./frontend:/app
      - react_node_modules:/app/node_modules
    networks:
      - pointage_net
    depends_on:
      - fastapi
      - django-hr
    restart: unless-stopped     

  # ── Cron ─────────────────────────────────────────────────────────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfiles/django_hr.Dockerfile
    container_name: pointage_cron
    restart: unless-stopped
    env_file: .env
    networks:
      - pointage_net
    depends_on:
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${HR_DB_NAME}
      - ATTENDANCE_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SERVICE_INTERNAL_KEY=${SERVICE_INTERNAL_KEY}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN_CRON}
    volumes:
      - ./django_hr:/app
    command: bash -c "echo '0 7 * * * cd /app && python3 manage.py send_cdd_alerts >> /var/log/cron.log 2>&1' > /etc/cron.d/hr-cron && echo '0 7 * * * cd /app && python3 manage.py send_maternity_alerts >> /var/log/cron.log 2>&1' >> /etc/cron.d/hr-cron && chmod 0644 /etc/cron.d/hr-cron && crontab /etc/cron.d/hr-cron && cron -f"

  glitchtip-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_PG_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql/data
    networks:
      - pointage_net

  glitchtip-redis:
    image: redis:7
    networks:
      - pointage_net

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_PG_PASSWORD}@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: https://${SERVER_IP}:8443
      DEFAULT_FROM_EMAIL: noreply@pb-industries.mg
      ALLOWED_HOSTS: ${SERVER_IP},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${SERVER_IP}:8443
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
    volumes:
      - glitchtip_uploads:/code/uploads
    networks:
      - pointage_net

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_PG_PASSWORD}@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: https://${SERVER_IP}:8443
      DEFAULT_FROM_EMAIL: noreply@pb-industries.mg
      ALLOWED_HOSTS: ${SERVER_IP},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${SERVER_IP}:8443
    networks:
      - pointage_net

volumes:
  django_hr_media:
  django_auth_static:
  glitchtip_pg_data:
  glitchtip_uploads:
  react_node_modules: