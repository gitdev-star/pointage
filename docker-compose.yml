services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_pointage
    ports:
      - "6380:6379"
    restart: unless-stopped

  django-auth:
    build:
      context: .
      dockerfile: Dockerfiles/django.Dockerfile
    container_name: django_auth
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=attendance
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_HOST=192.168.8.211
      - POSTGRES_PORT=5432
      - LDAP_SERVER_URI=ldap://192.168.8.1:389
      - DJANGO_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
      - JWT_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
    volumes:
      - ./django_auth:/app
    depends_on:
      redis:
        condition: service_started
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 8 --threads 2 --worker-class gthread --timeout 120 --max-requests 1000 --max-requests-jitter 50"

  django-hr:
    build:
      context: .
      dockerfile: Dockerfiles/django_hr.Dockerfile
    container_name: django_hr
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:pass@192.168.8.211:5432/hr_db
      - ATTENDANCE_DB_URL=postgresql://user:pass@192.168.8.211:5432/attendance
      - DJANGO_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
      - JWT_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://192.168.8.210:3000
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtpauth.moov.mg
      - EMAIL_PORT=465
      - EMAIL_USE_SSL=True
      - EMAIL_USE_TLS=False
      - EMAIL_HOST_USER=noreply@pb-industries.mg
      - EMAIL_HOST_PASSWORD=XFphaGzDKbzCTj7
      - DEFAULT_FROM_EMAIL=Systeme RH <noreply@pb-industries.mg>
      - PYTHONUNBUFFERED=1
    volumes:
      - ./django_hr:/app
      - django_hr_media:/app/media
    depends_on:
      django-auth:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "/app/entrypoint.sh"
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfiles/fastapi.Dockerfile
    container_name: fastapi
    network_mode: "host"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@192.168.8.211:5432/attendance
      - DJANGO_AUTH_URL=http://127.0.0.1:8000/api/clockers/
      - DJANGO_HR_URL=http://127.0.0.1:8002
      - DJANGO_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
    volumes:
      - ./:/app
    depends_on:
      django-auth:
        condition: service_started
    restart: unless-stopped

  sync:
    build:
      context: .
      dockerfile: Dockerfiles/fastapi.Dockerfile
    container_name: attendance_sync
    network_mode: "host"
    command: python sync_service.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@192.168.8.211:5432/attendance
      - DJANGO_AUTH_URL=http://127.0.0.1:8000/api/clockers/
      - DJANGO_HR_URL=http://127.0.0.1:8002
    volumes:
      - ./:/app
    depends_on:
      django-auth:
        condition: service_started
    restart: unless-stopped

  react:
    build:
      context: ./frontend
      dockerfile: ../Dockerfiles/react.Dockerfile
    container_name: react
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://192.168.8.210:8080
      - REACT_APP_AUTH_URL=http://192.168.8.210:8000
      - REACT_APP_HR_URL=http://192.168.8.210:8002
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=3000
    volumes:
      - ./frontend:/app
    depends_on:
      - fastapi
      - django-hr

  cron:
    build:
      context: .
      dockerfile: Dockerfiles/django_hr.Dockerfile
    container_name: pointage_cron
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - DATABASE_URL=postgresql://user:pass@192.168.8.211:5432/hr_db
      - ATTENDANCE_DB_URL=postgresql://user:pass@192.168.8.211:5432/attendance
      - DJANGO_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
      - JWT_SECRET_KEY=36746a5d1bddf0bd1fcc02e261af129d4cbb1ee88dc25ee90dde0e5e44dd0972
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtpauth.moov.mg
      - EMAIL_PORT=465
      - EMAIL_USE_SSL=True
      - EMAIL_USE_TLS=False
      - EMAIL_HOST_USER=noreply@pb-industries.mg
      - EMAIL_HOST_PASSWORD=XFphaGzDKbzCTj7
      - DEFAULT_FROM_EMAIL=Systeme RH <noreply@pb-industries.mg>
    volumes:
      - ./django_hr:/app
    command: bash -c "echo '0 7 * * * cd /app && python3 manage.py send_cdd_alerts >> /var/log/cron.log 2>&1' > /etc/cron.d/hr-cron && echo '0 7 * * * cd /app && python3 manage.py send_maternity_alerts >> /var/log/cron.log 2>&1' >> /etc/cron.d/hr-cron && chmod 0644 /etc/cron.d/hr-cron && crontab /etc/cron.d/hr-cron && cron -f"

volumes:
  postgres_data:
  django_hr_media:
