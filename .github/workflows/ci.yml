name: Pointage CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:


jobs:

# ==========================================================
# UNIT TESTS
# ==========================================================

  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: pointage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r django_auth/requirements.txt
          pip install -r django_hr/requirements.txt
          pip install pytest-timeout


      - name: FastAPI tests
        run: |
          pytest --tb=short -q --timeout=30 -m "not real_cross_service"

        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pointage_test
          SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SERVICE_INTERNAL_KEY: ci-test-service-key-minimum-32-chars-long


      - name: django_auth tests

        working-directory: django_auth

        run: |
          python -m pytest --tb=short -q --timeout=10

        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          LDAP_BIND_PASSWORD: test-ldap-password



      - name: django_hr tests

        working-directory: django_hr

        run: |
          python -m pytest --tb=short -q --timeout=30

        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long-hr
          SERVICE_INTERNAL_KEY: ci-test-service-key-minimum-32-chars-long
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pointage_test
          ATTENDANCE_DB_URL: postgresql://postgres:postgres@localhost:5432/pointage_test



# ==========================================================
# AUTH INTEGRATION
# ==========================================================

  auth-integration:

    needs: test

    runs-on: self-hosted

    if: github.ref == 'refs/heads/develop'


    defaults:
      run:
        working-directory: /home/github-runner/pointage


    steps:

      - name: Auth integration tests

        run: |

          docker compose exec -T fastapi \
          pytest tests/integration/test_cross_service_real.py \
          -v \
          --tb=short \
          -m real_cross_service



# ==========================================================
# HR INTEGRATION
# ==========================================================

  hr-integration:

    needs: auth-integration

    runs-on: self-hosted

    if: github.ref == 'refs/heads/develop'


    defaults:
      run:
        working-directory: /home/github-runner/pointage


    steps:

      - name: HR integration tests

        run: |

          docker compose exec -T fastapi \
          pytest tests/integration/test_django_hr_real.py \
          -v \
          --tb=short \
          -m real_cross_service



# ==========================================================
# END TO END
# ==========================================================

  end-to-end:

    needs: hr-integration

    runs-on: self-hosted

    if: github.ref == 'refs/heads/develop'


    defaults:
      run:
        working-directory: /home/github-runner/pointage


    steps:

      - name: End to end tests

        run: |

          docker compose exec -T fastapi \
          pytest tests/integration/test_attendance_integration.py \
          tests/integration/test_nginx_routing_real.py \
          -v \
          --tb=short



# ==========================================================
# DEPLOY TO 217 (LAST)
# ==========================================================

  deploy-test-217:

    needs: end-to-end

    runs-on: self-hosted

    if: github.ref == 'refs/heads/develop'


    defaults:
      run:
        working-directory: /home/github-runner/pointage


    steps:


      - name: Pull latest develop

        run: |

          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop



      - name: Build containers

        run: |

          docker compose build \
          fastapi \
          django-hr \
          django-auth \
          react



      - name: Restart containers

        run: |

          docker compose up -d \
          fastapi \
          django-hr \
          django-auth \
          react



      - name: Restart nginx

        run: |

          docker compose restart nginx



      - name: Run migrations

        run: |

          docker exec django_auth python manage.py migrate --noinput
          docker exec django_hr python manage.py migrate --noinput



# ==========================================================
# POST DEPLOY VALIDATION
# ==========================================================

  health-check:

    needs: deploy-test-217

    runs-on: self-hosted

    steps:

      - name: Health check

        run: |

          sleep 5

          curl -k -f \
          https://localhost/api/fastapi/health



  jwt-verification:

    needs: health-check

    runs-on: self-hosted


    steps:

      - name: Verify JWT secrets

        run: |

          AUTH_SECRET=$(docker exec django_auth printenv JWT_SECRET_KEY)

          FASTAPI_SECRET=$(docker exec fastapi printenv JWT_SECRET_KEY 2>/dev/null || docker exec fastapi printenv DJANGO_SECRET_KEY)


          if [ "$AUTH_SECRET" != "$FASTAPI_SECRET" ];

          then

            echo "JWT mismatch"

            exit 1

          fi


          echo "JWT OK"



# ==========================================================
# FINAL STATUS
# ==========================================================

  deployment-passed:

    needs: jwt-verification

    runs-on: self-hosted


    steps:

      - name: Success

        run: |

          echo "================================="
          echo "POINTAGE DEPLOYMENT SUCCESS"
          echo "================================="