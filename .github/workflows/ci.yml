name: Pointage CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pointage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r django_auth/requirements.txt
          pip install -r django_hr/requirements.txt
          pip install asyncpg aiosqlite pytest-timeout

      - name: Run FastAPI tests
        run: pytest --tb=short -q --timeout=30
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pointage_test
          SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          ENVIRONMENT: test
          DJANGO_AUTH_URL: http://mock-auth
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          SERVICE_INTERNAL_KEY: ci-test-service-key-minimum-32-chars-long

      - name: Run django_auth tests
        working-directory: django_auth
        run: python -m pytest --tb=short -q --timeout=10
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          LDAP_BIND_PASSWORD: test-ldap-password
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long

      - name: Run django_hr tests
        working-directory: django_hr
        run: python -m pytest --tb=short -q --timeout=30
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long-hr
          SERVICE_INTERNAL_KEY: ci-test-service-key-minimum-32-chars-long

  deploy-test-217:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: /home/github-runner/pointage
    steps:
      - name: Pull latest code into the real deploy directory
        run: |
          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop

      - name: Show what commit is being deployed
        run: |
          echo "Deploying commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --pretty=%B)"

      - name: Rebuild and restart backend containers
        run: |
          docker compose build fastapi django-hr django-auth
          docker compose up -d fastapi django-hr django-auth

      - name: Restart nginx to refresh upstream connections
        run: docker compose restart nginx

      - name: Run migrations
        run: |
          docker exec django_auth python manage.py migrate --noinput
          docker exec django_hr python manage.py migrate --noinput

      - name: Health check
        run: |
          sleep 5
          curl -k -f https://localhost/api/fastapi/health || (echo "FastAPI health check failed" && exit 1)

      - name: Show running containers
        run: docker compose ps