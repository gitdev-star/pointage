name: Pointage CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pointage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install asyncpg aiosqlite pytest-timeout

      - name: Run pytest
        run: pytest --tb=short -q --timeout=30
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pointage_test
          SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          ENVIRONMENT: test
          DJANGO_AUTH_URL: http://mock-auth
          DJANGO_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long

  deploy-dev:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Pull latest code
        run: |
          cd /home/github-runner/pointage
          git pull origin develop

      - name: Restart containers
        run: |
          cd /home/github-runner/pointage
          docker compose up -d --build

      - name: Run migrations
        run: |
          cd /home/github-runner/pointage
          docker compose exec -T django_hr python manage.py migrate

  deploy-prod:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to 210
        run: |
          ssh root@192.168.8.210 '
            cd /root/pointage &&
            git pull origin main &&
            docker compose up -d --no-build &&
            docker compose exec -T django_hr python manage.py migrate
          '
