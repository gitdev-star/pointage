name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
    
    - name: Create test databases
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: postgres
      run: |
        psql -c "CREATE DATABASE test_auth;"
        psql -c "CREATE DATABASE test_hr;"
        psql -c "CREATE DATABASE test_attendance;"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r django_auth/requirements.txt
        pip install -r django_hr/requirements.txt
    
    - name: Run FastAPI tests
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v
    
    - name: Run Django Auth tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings
      run: |
        cd django_auth
        pytest tests/ --cov=accounts,devices --cov-report=xml --cov-report=term-missing -v
    
    - name: Run Django HR tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings
      run: |
        cd django_hr
        pytest tests/ --cov=accounts,employees,payroll,leaves,alerts,sanctions,events,hr_events,reports,documents --cov-report=xml --cov-report=term-missing -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate coverage report
      if: always()
      run: |
        pytest --cov --cov-report=html --cov-report=term-missing || true
    
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
